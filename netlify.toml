[build]
  publish = "."
  command = "node build-tenders.js"
  functions = "netlify/functions"

[build.environment]
  NODE_VERSION = "18"

[[redirects]]
  from = "/admin"
  to = "/admin/index.html"
  status = 200

[[redirects]]
  from = "/admin/"
  to = "/admin/index.html"
  status = 200

[[headers]]
  for = "/uk-tenders.json"
  [headers.values]
    Access-Control-Allow-Origin = "*"
